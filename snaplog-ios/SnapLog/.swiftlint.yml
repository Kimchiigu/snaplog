disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - force_unwrapping
  - empty_count

force_unwrapping:
  error

line_length:
  warning: 140
  error: 180

type_body_length:
  - 300
  - 400

file_length:
  warning: 400
  error: 500

excluded:
  - .build
  - Pods
  - DerivedData
  - SnapLogUITests

custom_rules:
  no_empty_type_definitions:
    name: "No Empty Types"
    regex: '(?:class|struct|enum|protocol)\s+\w+\s*\{\s*\}'
    message: "Do not leave empty class, struct, enum, or protocol definitions."
    severity: error
